<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Staff Login - CGS MART</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-black text-center mb-6">Staff / Operator Login</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded text-sm {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label class="block text-sm font-bold text-slate-700 mb-2">Enter Registered Email ID</label>
            <input type="email" name="email" class="w-full border rounded-xl p-3 mb-6 outline-none focus:ring-2 focus:ring-[#D4AF37]" placeholder="e.g. operator@cgsmart.in" required>
            
            <button type="submit" class="w-full bg-[#0c0d12] hover:bg-[#1a1c24] text-white font-bold py-3 rounded-xl transition">Get 6-Digit OTP</button>
        </form>
    </div>
</body>
</html>
