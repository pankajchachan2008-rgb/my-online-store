{% extends 'base.html' %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 font-['Inter']">
    <div class="bg-white/80 backdrop-blur-xl border border-white/90 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.06)] p-8 md:p-12 w-full max-w-[500px]">
        <div class="text-center mb-8">
            <h3 class="font-['Jost'] text-2xl font-extrabold text-gray-900 mb-2">Update Password 🔑</h3>
            <p class="text-gray-500 text-sm font-medium">Kripya apna purana password aur naya password yahan dalein.</p>
        </div>
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div class="[&>p]:mb-4 [&>p>label]:block [&>p>label]:text-[11px] [&>p>label]:font-bold [&>p>label]:text-gray-500 [&>p>label]:uppercase [&>p>label]:tracking-wider [&>p>label]:mb-2 [&>p>input]:w-full [&>p>input]:bg-slate-50 [&>p>input]:border [&>p>input]:border-slate-200 [&>p>input]:rounded-xl [&>p>input]:px-4 [&>p>input]:py-3.5 [&>p>input]:text-sm [&>p>input]:font-medium [&>p>input]:text-slate-900 [&>p>input]:focus:ring-2 [&>p>input]:focus:ring-[#D4AF37] [&>p>input]:focus:bg-white [&>p>input]:outline-none [&>p>input]:transition [&>ul.errorlist]:text-red-500 [&>ul.errorlist]:text-xs [&>ul.errorlist]:font-bold">
                {{ form.as_p }}
            </div>
            
            <button type="submit" class="w-full bg-[#0c0d12] text-[#D4AF37] hover:bg-gray-800 font-bold uppercase tracking-widest py-4 rounded-xl shadow-lg hover:-translate-y-0.5 transition duration-300 mt-6">
                Change Password
            </button>
        </form>
        
        <div class="mt-8 pt-6 text-center border-t border-slate-100">
            <a href="{% url 'profile' %}" class="text-gray-600 font-bold hover:text-gray-900 transition text-sm flex items-center justify-center gap-2">
                <span>🔙</span> Back to Profile
            </a>
        </div>
    </div>
</div>
{% endblock %}
