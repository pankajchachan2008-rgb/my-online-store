{% extends 'base.html' %}
{% block title %}Forgot Password | CGSMART{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: #0F172A; font-family: 'Jost', sans-serif;">Forgot Password? 🔒</h2>
            <p class="text-muted">Apna registered email daalein. Hum aapko OTP aur Username bhejenge.</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label fw-bold small text-uppercase text-muted" style="letter-spacing: 1px;">Email Address</label>
                <input type="email" name="email" class="form-control form-control-lg bg-light border-0" placeholder="Enter your email" required style="font-size: 1rem;">
            </div>
            
            <button type="submit" class="btn btn-lg w-100 fw-bold text-white shadow-sm" style="background-color: #0F172A; letter-spacing: 1px;">SEND OTP</button>
        </form>
        
        <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'login' %}" class="text-decoration-none fw-bold" style="color: #0F172A;">🔙 Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
