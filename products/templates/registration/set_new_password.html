{% extends 'base.html' %}
{% block title %}Set New Password | CGSMART{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: #059669; font-family: 'Jost', sans-serif;">OTP Verified! ✅</h2>
            <p class="text-muted">Ab aap apna naya secure password set kar sakte hain.</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold small text-uppercase text-muted" style="letter-spacing: 1px;">New Password</label>
                <input type="password" name="password" class="form-control form-control-lg bg-light border-0" placeholder="Minimum 8 characters" required style="font-size: 1rem;" minlength="8">
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold small text-uppercase text-muted" style="letter-spacing: 1px;">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control form-control-lg bg-light border-0" placeholder="Re-enter password" required style="font-size: 1rem;" minlength="8">
            </div>
            
            <button type="submit" class="btn btn-lg w-100 fw-bold text-white shadow-sm" style="background-color: #059669; letter-spacing: 1px;">UPDATE PASSWORD</button>
        </form>
    </div>
</div>
{% endblock %}
