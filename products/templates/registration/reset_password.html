{% extends 'base.html' %}
{% block title %}Set New Password | CGSMART{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 font-['Inter']">
    <div class="bg-white/80 backdrop-blur-xl border border-white/90 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.06)] p-8 md:p-12 w-full max-w-[500px]">
        <div class="text-center mb-8">
            <h2 class="font-['Jost'] text-3xl font-black text-emerald-600 mb-2">OTP Verified! ✅</h2>
            <p class="text-gray-500 text-sm font-medium">Ab aap apna naya secure password set kar sakte hain.</p>
        </div>
        
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-2">New Password</label>
                <input type="password" name="password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition" placeholder="Minimum 8 characters" required minlength="8">
            </div>
            
            <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-2">Confirm Password</label>
                <input type="password" name="confirm_password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition" placeholder="Re-enter password" required minlength="8">
            </div>
            
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold uppercase tracking-widest py-4 rounded-xl shadow-lg hover:-translate-y-0.5 transition duration-300 mt-4">
                UPDATE PASSWORD
            </button>
        </form>
    </div>
</div>
{% endblock %}
