{% extends 'base.html' %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-10 px-4 font-['Inter']">
    <div class="bg-white border border-gray-200 rounded-[1.5rem] shadow-[0_10px_30px_rgba(0,0,0,0.05)] p-8 md:p-12 w-full max-w-[600px] text-center">
        <h2 class="font-extrabold text-3xl text-gray-900 mb-8">📦 Bulk Product Update</h2>
        
        <!-- Step 1: Download -->
        <div class="bg-blue-50/50 border border-blue-100 rounded-2xl p-6 mb-8">
            <p class="text-blue-800 font-medium mb-4 text-sm">Step 1: Apne saare products ki current list download karein aur Excel mein edit karein.</p>
            <a href="{% url 'export_products' %}" class="inline-block w-full bg-gray-900 hover:bg-black text-white font-bold py-3.5 rounded-xl shadow-md hover:-translate-y-0.5 transition duration-300 tracking-wide">
                📥 DOWNLOAD PRODUCTS (CSV)
            </a>
        </div>
        
        <!-- Divider -->
        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-gray-300 border-dashed"></div>
            <span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-bold uppercase tracking-wider">THEN</span>
            <div class="flex-grow border-t border-gray-300 border-dashed"></div>
        </div>
        
        <!-- Step 2: Upload -->
        <div class="bg-teal-50/50 border border-teal-100 rounded-2xl p-6 mt-4">
            <p class="text-teal-800 font-medium mb-4 text-sm">Step 2: Edit ki gayi .csv file ko yahan upload karein.</p>
            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                <div class="text-left">
                    <input type="file" name="csv_file" accept=".csv" required 
                           class="block w-full text-sm text-slate-500 
                                  file:mr-4 file:py-3 file:px-4 
                                  file:rounded-xl file:border-0 
                                  file:text-sm file:font-bold 
                                  file:bg-teal-100 file:text-teal-800 
                                  hover:file:bg-teal-200 hover:file:cursor-pointer
                                  border border-gray-200 rounded-xl p-2 bg-white outline-none focus:ring-2 focus:ring-teal-500 cursor-pointer transition">
                </div>
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold uppercase tracking-wide py-3.5 rounded-xl shadow-md hover:-translate-y-0.5 transition duration-300 mt-2">
                    🚀 UPLOAD & UPDATE PRODUCTS
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
