{% extends 'base.html' %}

{% block title %}Verify OTP | CGS MART Nohar{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 font-['Inter']"
     x-data="{ otp: '', verifying: false }">
    <div class="bg-white/90 backdrop-blur-xl border border-white/95 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.08)] p-8 md:p-12 w-full max-w-[450px]">
        
        <div class="w-16 h-16 bg-amber-50 border border-[#D4AF37]/40 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-5 shadow-sm">
            🔐
        </div>

        <h3 class="font-['Jost'] text-2xl font-extrabold text-gray-900 mb-2 text-center">Account Verification</h3>
        <p class="text-gray-500 text-sm text-center mb-8 leading-relaxed">
            Ek 6-digit ka OTP <b class="text-gray-900 break-all">{{ email }}</b> par bheja gaya hai.
        </p>

        <form method="POST" @submit="verifying = true" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="otpInput" class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 text-center">Enter 6-Digit OTP</label>
                <input type="text" 
                       id="otpInput"
                       name="otp" 
                       x-model="otp"
                       @input="otp = otp.replace(/[^0-9]/g, '').slice(0, 6)"
                       inputmode="numeric" 
                       autocomplete="one-time-code" 
                       pattern="[0-9]{6}"
                       maxlength="6" 
                       placeholder="••••••" 
                       required 
                       autofocus
                       class="w-full bg-white border-2 border-gray-300 rounded-xl px-4 py-4 text-center text-2xl tracking-[12px] font-extrabold text-gray-900 focus:ring-4 focus:ring-[#D4AF37]/25 focus:border-[#D4AF37] outline-none transition">
            </div>

            <button type="submit" 
                    :disabled="verifying || otp.length < 6" 
                    class="w-full bg-gradient-to-br from-[#0c0d12] to-[#1f2430] text-[#D4AF37] font-bold uppercase tracking-widest py-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition duration-300 border border-[#D4AF37]/30 disabled:opacity-50 disabled:cursor-not-allowed">
                <span x-show="!verifying">Verify OTP</span>
                <span x-show="verifying" x-cloak>⏳ Verifying...</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
