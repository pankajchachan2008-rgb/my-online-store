<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product - CGSMART ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Jost:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter'] text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white border border-slate-200 shadow-[0_15px_40px_rgba(0,0,0,0.06)] rounded-[2rem] p-8 md:p-10 w-full max-w-[750px]">
        <div class="text-center mb-8">
            <h4 class="font-['Jost'] font-extrabold text-3xl text-slate-900 mb-2">Add New Product</h4>
            <p class="text-slate-500 text-sm font-medium">Enter details to add a new item to the inventory.</p>
        </div>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Product Name</label>
                    <input type="text" name="name" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#D4AF37] outline-none transition" required placeholder="e.g. Parle G Biscuit 100g">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Price (₹)</label>
                    <input type="number" step="0.01" name="price" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold text-emerald-600 focus:ring-2 focus:ring-emerald-500 outline-none transition" required placeholder="0.00">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Opening Stock Qty</label>
                    <input type="number" name="stock" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 outline-none transition" required value="50">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Category</label>
                    <select name="category" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#D4AF37] outline-none transition">
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">HSN Code (For GST)</label>
                    <input type="text" name="hsn_code" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#D4AF37] outline-none transition" placeholder="e.g. 1905">
                </div>
                
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Product Image</label>
                    <input type="file" name="image" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 border border-slate-300 rounded-xl p-2 bg-white outline-none cursor-pointer transition" accept="image/*">
                </div>
                
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Description</label>
                    <textarea name="description" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-[#D4AF37] outline-none transition" rows="3" placeholder="Product details..."></textarea>
                </div>
            </div>

            <div class="flex justify-between items-center pt-6 mt-6 border-t border-slate-100">
                <a href="{% url 'erp_products' %}" class="text-slate-500 hover:text-slate-900 font-bold uppercase tracking-widest px-6 py-3 text-sm transition">Cancel</a>
                <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-[#D4AF37] font-bold uppercase tracking-widest px-8 py-3.5 rounded-xl shadow-lg transition">Save Product</button>
            </div>
        </form>
    </div>

</body>
</html>
