<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product - CGSMART ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 700px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h4 class="fw-bold mb-4">Add New Product to Inventory</h4>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-bold small">Product Name</label>
                        <input type="text" name="name" class="form-control border-2" required placeholder="e.g. Parle G Biscuit 100g">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Price (₹)</label>
                        <input type="number" step="0.01" name="price" class="form-control border-2" required placeholder="0.00">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Opening Stock Qty</label>
                        <input type="number" name="stock" class="form-control border-2" required value="50">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Category</label>
                        <select name="category" class="form-select border-2">
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">HSN Code (For GST Invoice)</label>
                        <input type="text" name="hsn_code" class="form-control border-2" placeholder="e.g. 1905">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold small">Product Image</label>
                        <input type="file" name="image" class="form-control border-2" accept="image/*">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold small">Description</label>
                        <textarea name="description" class="form-control border-2" rows="2" placeholder="Product details..."></textarea>
                    </div>
                    <div class="col-12 mt-4 d-flex justify-content-between">
                        <a href="{% url 'erp_products' %}" class="btn btn-outline-secondary px-4 fw-bold">Cancel</a>
                        <button type="submit" class="btn btn-dark px-4 fw-bold">Save Product</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
