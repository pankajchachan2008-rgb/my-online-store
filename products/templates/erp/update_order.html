<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Order #{{ order.id }} - CGSMART ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h4 class="fw-bold mb-3">Manage Order #{{ order.id }}</h4>
            <p class="text-muted">Customer: <strong>{{ order.customer_name }}</strong> | Total: <strong class="text-success">₹{{ order.total_amount }}</strong></p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold small">Update Order Status</label>
                    <select name="status" class="form-select border-2">
                        <option value="Pending" {% if order.status == 'Pending' %}selected{% endif %}>Pending</option>
                        <option value="Processing" {% if order.status == 'Processing' %}selected{% endif %}>Processing</option>
                        <option value="Out for Delivery" {% if order.status == 'Out for Delivery' %}selected{% endif %}>Out for Delivery</option>
                        <option value="Completed" {% if order.status == 'Completed' %}selected{% endif %}>Completed (Delivered)</option>
                        <option value="Cancelled" {% if order.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Courier / Delivery Partner Name</label>
                    <input type="text" name="courier_name" class="form-control border-2" value="{{ order.courier_name|default:'' }}" placeholder="e.g. DTDC, Blue Dart, Local Delivery">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Tracking ID / Waybill No.</label>
                    <input type="text" name="tracking_id" class="form-control border-2" value="{{ order.tracking_id|default:'' }}" placeholder="e.g. TRK123456789">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small">Tracking Live URL (Optional)</label>
                    <input type="url" name="tracking_url" class="form-control border-2" value="{{ order.tracking_url|default:'' }}" placeholder="https://www.courierwebsite.com/track/...">
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'erp_dashboard' %}" class="btn btn-outline-secondary px-4 fw-bold">Back</a>
                    <button type="submit" class="btn btn-dark px-4 fw-bold">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
