<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Order #{{ order.id }} - CGSMART ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 650px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h4 class="fw-bold mb-3">Manage Order #{{ order.id }}</h4>
            <p class="text-muted">Customer: <strong>{{ order.customer_name }}</strong> | Total: <strong class="text-success">₹{{ order.total_amount }}</strong></p>
            
            <form method="POST">
                {% csrf_token %}
                
                <!-- STATUS UPDATE -->
                <div class="mb-4">
                    <label class="form-label fw-bold small">Update Order Status</label>
                    <select name="status" class="form-select border-2 fw-bold">
                        <option value="Pending" {% if order.status == 'Pending' %}selected{% endif %}>Pending</option>
                        <option value="Processing" {% if order.status == 'Processing' %}selected{% endif %}>Processing (Packing)</option>
                        <option value="Dispatched" {% if order.status == 'Dispatched' %}selected{% endif %}>Dispatched / Out for Delivery</option>
                        <option value="Completed" {% if order.status == 'Completed' %}selected{% endif %}>Completed (Delivered)</option>
                        <option value="Cancelled" {% if order.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                    </select>
                </div>

                <div class="row mb-4">
                    <!-- OPTION A: LOCAL DELIVERY -->
                    <div class="col-md-12 mb-3">
                        <div class="p-3 bg-white border border-2 border-primary rounded-3">
                            <label class="form-label fw-bold small text-primary">🛵 Option A: Assign Local Delivery Boy (Apna Staff)</label>
                            <select name="delivery_boy" class="form-select">
                                <option value="">-- No Local Delivery Boy Assigned --</option>
                                {% for boy in delivery_boys %}
                                    <option value="{{ boy.id }}" {% if order.delivery_boy and order.delivery_boy.id == boy.id %}selected{% endif %}>
                                        {{ boy.name }} ({{ boy.mobile_number }})
                                    </option>
                                {% endfor %}
                            </select>
                            <small class="text-muted d-block mt-1">Agar apna staff bhej rahe hain toh ise select karein.</small>
                        </div>
                    </div>

                    <div class="text-center mb-3 fw-bold text-muted">OR (Ya fir)</div>

                    <!-- OPTION B: EXTERNAL COURIER -->
                    <div class="col-md-12">
                        <div class="p-3 bg-white border border-2 border-info rounded-3">
                            <label class="form-label fw-bold small text-info mb-3">📦 Option B: External Courier (Bahar Ke Orders ke liye)</label>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Courier / Partner Name</label>
                                <input type="text" name="courier_name" class="form-control form-control-sm" value="{{ order.courier_name|default:'' }}" placeholder="e.g. DTDC, Blue Dart">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">Tracking ID / Waybill No.</label>
                                <input type="text" name="tracking_id" class="form-control form-control-sm" value="{{ order.tracking_id|default:'' }}" placeholder="e.g. TRK123456789">
                            </div>

                            <div class="mb-2">
                                <label class="form-label fw-bold small">Tracking Live URL (Optional)</label>
                                <input type="url" name="tracking_url" class="form-control form-control-sm" value="{{ order.tracking_url|default:'' }}" placeholder="https://www.courierwebsite.com/track/...">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between pt-3 border-top">
                    <a href="{% url 'erp_dashboard' %}" class="btn btn-outline-secondary px-4 fw-bold">Back</a>
                    <button type="submit" class="btn btn-dark px-4 fw-bold">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
