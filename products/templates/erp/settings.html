<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Settings - CGSMART ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; color: #0F172A; }
        .sidebar { width: 260px; background: #0F172A; color: #fff; position: fixed; height: 100vh; left: 0; top: 0; padding-top: 20px; }
        .sidebar a { display: block; padding: 15px 25px; color: #94A3B8; text-decoration: none; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.05); color: #fff; border-left: 4px solid #D4AF37; }
        .main-content { margin-left: 260px; padding: 30px 40px; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h4 class="text-center text-warning fw-bold mb-4" style="letter-spacing: 2px;">CGSMART ERP</h4>
        <a href="{% url 'erp_dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'erp_products' %}">🛍️ Product Master</a>
        <a href="{% url 'erp_pos' %}">🧾 Billing & POS</a>
        <a href="{% url 'erp_ledger' %}">📒 Customer Ledger</a>
        <a href="{% url 'erp_settings' %}" class="active">⚙️ Store Settings</a>
        <a href="{% url 'home' %}" target="_blank" class="text-info mt-5">🌐 Go to Live Store</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <h3 class="fw-bold mb-4">Store Profile & Invoice Settings</h3>

        <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 700px;">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-bold small">Store Name</label>
                        <input type="text" name="store_name" class="form-control border-2" value="{{ setting.store_name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Proprietor / Owner Name</label>
                        <input type="text" name="owner_name" class="form-control border-2" value="{{ setting.owner_name }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Contact Phone</label>
                        <input type="text" name="phone" class="form-control border-2" value="{{ setting.phone|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">GSTIN Number</label>
                        <input type="text" name="gstin" class="form-control border-2" value="{{ setting.gstin|default:'' }}" placeholder="e.g. 08AAAAA0000A1Z5">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold small">Store Address</label>
                        <textarea name="address" class="form-control border-2" rows="2">{{ setting.address|default:'' }}</textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold small">Receipt Footer Note</label>
                        <input type="text" name="receipt_footer" class="form-control border-2" value="{{ setting.receipt_footer }}">
                    </div>
                    <div class="col-12 mt-4 text-end">
                        <button type="submit" class="btn btn-dark fw-bold px-4 py-2">Save Store Settings</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
