<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Settings - CGSMART ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter'] text-slate-800 antialiased h-screen overflow-hidden flex">

    <!-- SIDEBAR -->
    <div class="w-[260px] bg-slate-900 text-white flex-shrink-0 h-screen py-6 shadow-2xl z-[100] overflow-y-auto">
        <h4 class="text-center text-[#D4AF37] font-extrabold tracking-widest text-xl mb-8 border-b border-white/10 pb-5">CGSMART ERP</h4>
        <nav class="flex flex-col">
            <a href="{% url 'erp_dashboard' %}" class="px-6 py-3.5 text-sm font-medium text-slate-400 hover:bg-white/5 transition">📊 Dashboard</a>
            <a href="{% url 'erp_products' %}" class="px-6 py-3.5 text-sm font-medium text-slate-400 hover:bg-white/5 transition">🛍️ Product Master</a>
            <a href="{% url 'erp_pos' %}" class="px-6 py-3.5 text-sm font-medium text-slate-400 hover:bg-white/5 transition">🧾 Billing & POS</a>
            <a href="{% url 'erp_ledger' %}" class="px-6 py-3.5 text-sm font-medium text-slate-400 hover:bg-white/5 transition">📒 Customer Ledger</a>
            <a href="{% url 'erp_settings' %}" class="px-6 py-3.5 text-sm font-medium text-white bg-white/10 border-l-4 border-[#D4AF37] transition">⚙️ Store Settings</a>
            <a href="{% url 'home' %}" target="_blank" class="block mt-8 px-6 text-sky-400 text-sm font-bold">🌐 Go to Live Store</a>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 p-6 lg:p-10 h-screen overflow-y-auto flex justify-center">
        
        <div class="w-full max-w-[800px]">
            <h3 class="font-extrabold text-2xl text-slate-900 mb-8">Store Profile & Invoice Settings</h3>

            <div class="bg-white border border-slate-200 shadow-[0_10px_30px_rgba(0,0,0,0.04)] rounded-3xl p-8 md:p-10">
                <form method="POST" class="space-y-6">
                    {% csrf_token %}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Store Name</label>
                            <input type="text" name="store_name" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition" value="{{ setting.store_name }}" required>
                        </div>
                        
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Proprietor / Owner Name</label>
                            <input type="text" name="owner_name" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition" value="{{ setting.owner_name }}">
                        </div>
                        
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Contact Phone</label>
                            <input type="text" name="phone" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition" value="{{ setting.phone|default:'' }}">
                        </div>
                        
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">GSTIN Number</label>
                            <input type="text" name="gstin" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold tracking-wider focus:ring-2 focus:ring-blue-500 outline-none transition" value="{{ setting.gstin|default:'' }}" placeholder="e.g. 08AAAAA0000A1Z5">
                        </div>
                        
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Store Address</label>
                            <textarea name="address" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition" rows="3">{{ setting.address|default:'' }}</textarea>
                        </div>
                        
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Receipt Footer Note (Printed on Invoice)</label>
                            <input type="text" name="receipt_footer" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition" value="{{ setting.receipt_footer }}">
                        </div>
                    </div>

                    <div class="pt-6 border-t border-slate-100 flex justify-end">
                        <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-[#D4AF37] font-bold uppercase tracking-widest px-8 py-3.5 rounded-xl shadow-lg transition">Save Store Settings</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
